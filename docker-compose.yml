services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sourcemonster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-sourcemonster}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sourcemonster} -d ${POSTGRES_DB:-sourcemonster}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sourcemonster}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-sourcemonster}
      RUN_MIGRATIONS: "true"
    ports:
      - "4321:4321"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

